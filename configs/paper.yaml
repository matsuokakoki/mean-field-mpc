profile: paper
seed: 1729
seeds: [1729, 1730, 1731, 1732, 1733, 1734, 1735, 1736, 1737, 1738]
data:
  source_url: https://github.com/Azure/AzurePublicDataset/raw/master/data/AzureFunctionsInvocationTraceForTwoWeeksJan2021.rar
  bin_seconds: 300
  synthetic_if_missing: false
  scenario_eligibility:
    min_train_events: 500
    min_validation_events: 100
    min_test_events: 100
    min_validation_nonzero_bins: 12
    min_test_nonzero_bins: 12
    min_validation_nonzero_fraction: 0.02
    min_test_nonzero_fraction: 0.02
    min_train_service_samples: 500
    min_train_nonzero_bins: 24
    min_train_unique_positive_counts: 3
forecast:
  horizons: [1, 2, 3]
  max_train: 1200
  gp_restarts: 1
  ewma_alpha: 0.3
control:
  n: 100
  d: 2
  min_fraction: 0.05
  ramp_fraction: 0.20
  activation_delay_bins: 1
  horizon: 3
  rho_max: 0.995
  rho_static: 0.75
  rho_reactive: 0.70
  target_mean_utilization: 0.65
  alpha_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
  alpha_search:
    min_alpha: 0.001
    max_alpha: 100.0
    initial_points: 9
    max_refinements: 12
    relative_tolerance: 0.02
  queue_weight: 1.0
  switching_weight: 0.05
  capacity_step: 2
simulation:
  workers: 6
  service_models: [exponential_matched, empirical]
  evaluation_bins: 288
  max_events_per_bin: 2500
  min_jobs_for_tail_metric: 100
meanfield:
  workers: 6
  n_values: [25, 50, 100, 200, 400]
  rho_values: [0.5, 0.7, 0.9]
  d_values: [1, 2]
  tail_tolerance: 1.0e-12
  tail_max: 10000
  warmup_time: 1000.0
  measurement_time: 3000.0
