[project]
name = "mfcontrol"
version = "0.1.0"
description = "Uncertainty-aware mean-field capacity control experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "matplotlib==3.10.6",
  "numpy==2.3.2",
  "pandas==2.3.2",
  "pyyaml==6.0.2",
  "requests==2.32.5",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pandas-stubs==2.3.2.250827",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
  "types-pyyaml==6.0.12.20250822",
  "types-requests==2.32.4.20250809",
]

[project.scripts]
mfcontrol = "mfcontrol.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfcontrol"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mfcontrol"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["mfcontrol"]
omit = [
  "src/mfcontrol/__main__.py",
  "src/mfcontrol/analysis/reporting.py",
  "src/mfcontrol/cli.py",
  "src/mfcontrol/data/azure.py",
  "src/mfcontrol/data/preprocess.py",
  "src/mfcontrol/experiments/*.py",
  "src/mfcontrol/provenance.py",
]

[tool.coverage.report]
fail_under = 80
